[package]
name = "foghud"
version = "0.1.0"
edition = "2024"
description = "Crosshair overlay for Dead by Daylight, for Linux and Windows"
license = "MIT"
repository = "https://github.com/zeisure/foghud"
keywords = ["overlay", "crosshair", "gaming", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
# The control panel. Pure Rust and statically linked, which keeps the "one
# binary, no runtime to install" property that this project chose Rust for in the
# first place — a GTK or Qt panel would put a toolkit dependency in front of
# every Windows user. `glow` rather than `wgpu`: the panel draws a handful of
# widgets, so the lighter GL backend is plenty.
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
dirs = "6.0.0"
fontdue = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.12.0"

[target."cfg(unix)".dependencies]
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
libc = "0.2.189"
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.15"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
